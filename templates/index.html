<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detection</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 760px;">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Emotion Detection</h1>
                <p class="text-muted">
                    Enter a sentence to identify its emotional tone.
                </p>

                <label for="textToAnalyze" class="form-label">
                    Text to analyze
                </label>

                <textarea
                    id="textToAnalyze"
                    class="form-control"
                    rows="4"
                    placeholder="Type your sentence here..."
                ></textarea>

                <button
                    type="button"
                    class="btn btn-primary mt-3"
                    onclick="RunSentimentAnalysis()"
                >
                    Analyze emotions
                </button>

                <div
                    id="system_response"
                    class="alert alert-secondary mt-4"
                    role="status"
                    aria-live="polite"
                >
                    Your analysis will appear here.
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
